</style></head><body><header><p>ASTRA’S PET PROGRAMS · VISUAL STYLE PICKER</p><h1>Pick your favorite little world.</h1><p>Ten rendered styles. Same tools, different alignment and border details.</p><p>Open a tool bubble to compare its controls. Tap a pack to mark your favorite—this does not apply it to your apps yet.</p></header><main class="gallery" id="gallery"></main><p id="selection" role="status"></p><script>
const kits=[['A','Pet Atelier','Centered titles and focal points. Tiny opposite-corner stars; tools stay left-aligned.'],['B','Pocket Console','Centered title and pet. Left section titles; three miniature indicator dots.'],['C','Storybook','Centered titles. Warm fine borders with a small curled corner flourish.'],['D','Sticker Album','Centered title and pet. Left section titles with a tiny flower sticker.'],['E','Cyber Charm','Centered title and pet. Left section titles; luminous corner tick and diamond.'],['F','Ribbon Garden','Centered titles. Small ribbon tabs and a delicate lower-border flourish.'],['G','Mini Observatory','Centered title and pet. Left section titles with a tiny constellation.'],['H','Cozy Desktop','Centered title and pet. Left headings and actions; subtle stitched corner.'],['I','Jewelry Box','Centered titles and primary action. Fine gold border and diamond clasps.'],['J','Clean Charm','Centered title and pet. Left headings and actions; one tiny title sparkle.']];
for(const [letter,name,note] of kits){const card=document.createElement('article');card.className='kit '+letter.toLowerCase();card.innerHTML=`<div class="kit-label"><span class="letter">${letter}</span><strong>${name}</strong></div><div class="sample"><h2>The Farm</h2><p class="sub">Your pets, tools, and little daily rounds.</p><div class="pet"><img src="../art/icons/astras-pet-os-20261012.png" alt="Friendly Farmer"></div><fieldset><legend>Daily tools</legend><details><summary>pet-roster</summary><div class="controls"><label><input type="checkbox" checked> ON</label><label><input type="checkbox"> Sick</label><p>Find your pets and open their Pet Programs.</p></div></details><details open><summary>daily-rounds</summary><div class="controls"><label><input type="checkbox" checked> ON</label><label><input type="checkbox"> Sick</label><p>A little check-in on the farm’s latest updates.</p></div></details><div class="actions"><button class="action" type="button">Preview action</button></div></fieldset></div><p class="notes">${note}</p><button type="button" class="pick" aria-pressed="false">Pick ${letter} · ${name}</button>`;card.querySelector('.pick').onclick=()=>{document.querySelectorAll('.kit').forEach(c=>{c.classList.remove('selected');c.querySelector('.pick').setAttribute('aria-pressed','false')});card.classList.add('selected');card.querySelector('.pick').setAttribute('aria-pressed','true');document.querySelector('#selection').textContent=`Your preview pick: ${letter} · ${name}. Tell me “${letter}” in chat to use it going forward.`};card.querySelector('.action').onclick=()=>{document.querySelector('#selection').textContent='This is a style sample only; no pet tools have been run.'};document.querySelector('#gallery').append(card)}
</script></body></html>
